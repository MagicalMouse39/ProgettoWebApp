apiVersion: v1
kind: Service
metadata:
  name: swagger
  namespace: horsecare
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
    name: http
  selector:
    app: swagger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger
  namespace: horsecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger
  template:
    metadata:
      labels:
        app: swagger
    spec:
      containers:
      - name: swagger
        image: swaggerapi/swagger-ui
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: API_URL
          value: http://localhost:30080/api/
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
