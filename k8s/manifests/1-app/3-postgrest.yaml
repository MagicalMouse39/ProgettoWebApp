apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: horsecare
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: postgrest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: horsecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        # Define user, pass, and db first so they can be expanded in PGRST_DB_URI
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: horsecare-secrets
              key: pg-user
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: horsecare-secrets
              key: pg-pass
        - name: PG_DB
          valueFrom:
            secretKeyRef:
              name: horsecare-secrets
              key: pg-db
        - name: PGRST_DB_URI
          value: postgres://$(PG_USER):$(PG_PASS)@database:5432/$(PG_DB)
        - name: PGRST_OPENAPI_SERVER_PROXY_URI
          value: http://127.0.0.1:3000
        - name: PGRST_OPENAPI_MODE
          value: ignore-privileges
        - name: PGRST_DB_ANON_ROLE
          value: anon
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: horsecare-secrets
              key: pgrst-jwt-secret
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
