apiVersion: v1
kind: ConfigMap
metadata:
  name: revproxy-config
  namespace: horsecare
data:
  default.conf: |
    # API upstream
    upstream api {
      server postgrest:3000;
    }

    # Frontend upstream
    upstream frontend_app {
      server frontend:80;
    }

    server {
      server_name localhost;
      access_log /var/log/nginx/access.log;
      listen 80;

      sendfile on;
      default_type application/octet-stream;

      location /api/ {
        default_type application/json;
        proxy_hide_header Content-Location;
        add_header Content-Location /api/$upstream_http_content_location;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_pass http://api/;
      }

      location / {
        proxy_pass http://frontend_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revproxy
  namespace: horsecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revproxy
  template:
    metadata:
      labels:
        app: revproxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: revproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: revproxy
  namespace: horsecare
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
  selector:
    app: revproxy
